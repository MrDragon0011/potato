<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin &middot; TAD Chat</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 20px 60px;
      line-height: 1.5;
      color: #1a1a1a;
    }
    h1{ margin-bottom: 4px; }
    h2{ margin-top: 32px; font-size: 1.1rem; }
    input[type="text"], input[type="password"]{
      padding: 8px;
      font-size: 1rem;
      width: 100%;
      box-sizing: border-box;
      margin: 6px 0;
    }
    button{
      padding: 8px 14px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 4px;
    }
    .row{ display: flex; gap: 8px; align-items: center; }
    .row input{ flex: 1; }
    ul{ padding-left: 20px; }
    .msg{ margin-top: 10px; font-size: 0.9rem; }
    .msg.error{ color: #b00020; }
    .msg.ok{ color: #146c2e; }
    #panel{ display: none; }
  </style>
</head>
<body>
  <h1>TAD Chat &mdash; Admin</h1>

  <div id="login">
    <p>Enter the admin token to continue.</p>
    <input type="password" id="token-input" placeholder="Admin token" autocomplete="off">
    <button id="login-btn">Continue</button>
    <p class="msg error" id="login-msg"></p>
  </div>

  <div id="panel">
    <h2>Ban an IP</h2>
    <div class="row">
      <input type="text" id="ban-input" placeholder="IP address">
      <button id="ban-btn">Ban</button>
    </div>

    <h2>Currently banned IPs</h2>
    <button id="refresh-btn">Refresh list</button>
    <ul id="banned-list"></ul>

    <p class="msg" id="panel-msg"></p>
    <p><button id="logout-btn">Log out</button></p>
  </div>

  <script>
    const loginDiv = document.getElementById('login');
    const panelDiv = document.getElementById('panel');
    const loginMsg = document.getElementById('login-msg');
    const panelMsg = document.getElementById('panel-msg');
    const bannedList = document.getElementById('banned-list');

    let adminToken = sessionStorage.getItem('adminToken') || '';

    function setPanelMsg(text, isError) {
      panelMsg.textContent = text || '';
      panelMsg.className = 'msg ' + (isError ? 'error' : 'ok');
    }

    async function adminFetch(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: {
          ...(options.headers || {}),
          'x-admin-token': adminToken,
        },
      });
      if (res.status === 403) {
        adminToken = '';
        sessionStorage.removeItem('adminToken');
        showLogin('Token rejected. Please re-enter it.');
        throw new Error('Forbidden');
      }
      return res;
    }

    function showLogin(message) {
      loginDiv.style.display = '';
      panelDiv.style.display = 'none';
      loginMsg.textContent = message || '';
    }

    function showPanel() {
      loginDiv.style.display = 'none';
      panelDiv.style.display = '';
      loadBanned();
    }

    async function loadBanned() {
      try {
        const res = await adminFetch('/admin/banned');
        const data = await res.json();
        bannedList.innerHTML = '';
        (data.bannedIps || []).forEach((ip) => {
          const li = document.createElement('li');
          const span = document.createElement('span');
          span.textContent = ip + ' ';
          const btn = document.createElement('button');
          btn.textContent = 'Unban';
          btn.addEventListener('click', () => unban(ip));
          li.appendChild(span);
          li.appendChild(btn);
          bannedList.appendChild(li);
        });
      } catch (err) {
        // adminFetch already handled 403; anything else, show a generic message
        if (err.message !== 'Forbidden') setPanelMsg('Could not load banned list.', true);
      }
    }

    async function ban(ip) {
      if (!ip) return;
      try {
        const res = await adminFetch('/admin/ban', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ip }),
        });
        if (!res.ok) {
          setPanelMsg('Failed to ban.', true);
          return;
        }
        setPanelMsg('Banned ' + ip + '.', false);
        document.getElementById('ban-input').value = '';
        loadBanned();
      } catch (err) {
        if (err.message !== 'Forbidden') setPanelMsg('Failed to ban.', true);
      }
    }

    async function unban(ip) {
      try {
        const res = await adminFetch('/admin/unban', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ip }),
        });
        if (!res.ok) {
          setPanelMsg('Failed to unban.', true);
          return;
        }
        setPanelMsg('Unbanned ' + ip + '.', false);
        loadBanned();
      } catch (err) {
        if (err.message !== 'Forbidden') setPanelMsg('Failed to unban.', true);
      }
    }

    document.getElementById('login-btn').addEventListener('click', async () => {
      const value = document.getElementById('token-input').value.trim();
      if (!value) return;
      adminToken = value;
      try {
        const res = await fetch('/admin/banned', { headers: { 'x-admin-token': adminToken } });
        if (res.status === 403) {
          adminToken = '';
          loginMsg.textContent = 'Incorrect token.';
          return;
        }
        sessionStorage.setItem('adminToken', adminToken);
        document.getElementById('token-input').value = '';
        showPanel();
      } catch (err) {
        loginMsg.textContent = 'Could not reach server.';
      }
    });

    document.getElementById('ban-btn').addEventListener('click', () => {
      ban(document.getElementById('ban-input').value.trim());
    });

    document.getElementById('refresh-btn').addEventListener('click', loadBanned);

    document.getElementById('logout-btn').addEventListener('click', () => {
      adminToken = '';
      sessionStorage.removeItem('adminToken');
      showLogin('');
    });

    if (adminToken) {
      showPanel();
    } else {
      showLogin('');
    }
  </script>
</body>
</html>
